<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23EA4335' d='M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z'/%3E%3Cpath fill='%234285F4' d='M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4 6.8-10 6.8-17.2z'/%3E%3Cpath fill='%23FBBC05' d='M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z'/%3E%3Cpath fill='%2334A853' d='M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=block">
  <style>
    :root {
      --color-bg: #ffffff;
      --color-bg-rgb: 255, 255, 255;
      --fade-height: 48px;
      --color-text: #202124;
      --color-text-secondary: #4d5156;
      --color-text-muted: #70757a;
      --color-icon: #5f6368;
      --color-link: #1a0dab;
      --color-border: #dadce0;
      --color-chip: #f1f3f4;
      --color-chip-hover: #e8eaed;
      --color-footer: #f2f2f2;
      --color-accent: #1a73e8;
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --font-body: arial, sans-serif;
      --font-brand: "Google Sans", "Segoe UI", Roboto, arial, sans-serif;
      --content-indent: 180px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .icon {
      display: block;
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--font-brand);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .blue   { color: var(--google-blue); }
    .red    { color: var(--google-red); }
    .yellow { color: var(--google-yellow); }
    .green  { color: var(--google-green); }

    .icon-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--color-icon);
      cursor: pointer;
    }

    .icon-button:hover {
      background: rgba(60, 64, 67, 0.08);
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      outline: 4px solid transparent;
      background: var(--color-accent);
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .avatar:hover {
      outline-color: rgba(60, 64, 67, 0.08);
    }

    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 584px;
      height: 46px;
      padding: 0 6px 0 14px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      background: #ffffff;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text);
      font-family: inherit;
      font-size: 16px;
    }

    .search-box-leading {
      display: flex;
      margin-right: 12px;
      color: #9aa0a6;
    }

    .search-box-tools {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .search-box-divider {
      width: 1px;
      height: 28px;
      margin: 0 4px;
      background: var(--color-border);
    }

    .home {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .home-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 15px;
      height: 60px;
      padding: 6px 16px 0;
    }

    .home-topbar-link {
      color: rgba(0, 0, 0, 0.87);
      font-size: 13px;
    }

    .home-topbar-link:hover {
      text-decoration: underline;
    }

    .home-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      padding-top: calc(16vh - 20px);
      padding-top: calc(16dvh - 20px);
    }

    .home-logo {
      margin-bottom: 26px;
      font-size: 92px;
    }

    .home-buttons {
      display: flex;
      justify-content: center;
      gap: 11px;
      margin-top: 29px;
    }

    .home-button {
      height: 36px;
      padding: 0 16px;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      background: #f8f9fa;
      color: #3c4043;
      font-size: 14px;
      cursor: pointer;
    }

    .home-button:hover {
      border-color: var(--color-border);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      color: var(--color-text);
    }

    .home-language {
      margin-top: 28px;
      color: var(--color-text-secondary);
      font-size: 13px;
    }

    .home-language a {
      margin: 0 3px;
      color: var(--color-link);
    }

    .home-language a:hover {
      text-decoration: underline;
    }

    .home-footer {
      background: var(--color-footer);
      color: var(--color-text-muted);
      font-size: 15px;
    }

    .home-footer-country {
      padding: 15px 30px;
      border-bottom: 1px solid var(--color-border);
    }

    .home-footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0 20px;
    }

    .home-footer-links div {
      display: flex;
      flex-wrap: wrap;
    }

    .home-footer-links a {
      padding: 15px;
      font-size: 14px;
    }

    .home-footer-links a:hover {
      text-decoration: underline;
    }

    .home-footer-copyright {
      padding: 15px;
      font-size: 14px;
      text-align: center;
    }

    .serp {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page-fade {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 5;
      height: var(--fade-height);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      background: linear-gradient(to bottom,
        rgb(var(--color-bg-rgb)) 0%,
        rgba(var(--color-bg-rgb), 0.90) 20%,
        rgba(var(--color-bg-rgb), 0.65) 40%,
        rgba(var(--color-bg-rgb), 0.35) 60%,
        rgba(var(--color-bg-rgb), 0.15) 80%,
        rgba(var(--color-bg-rgb), 0) 100%
      );
    }

    .page-fade-top {
      top: 0;
    }

    .page-fade-bottom {
      bottom: 0;
      transform: scaleY(-1);
    }

    .page-fade.is-visible {
      opacity: 1;
    }

    @property --fade-start {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    @property --fade-end {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    .scroll-fade-x {
      --fade-start: 0px;
      --fade-end: 0px;
      transition: --fade-start 0.2s, --fade-end 0.2s;
      -webkit-mask-image: var(--fade-mask);
      mask-image: var(--fade-mask);
      --fade-mask: linear-gradient(to right,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0.10) calc(var(--fade-start) * 0.2),
        rgba(0, 0, 0, 0.35) calc(var(--fade-start) * 0.4),
        rgba(0, 0, 0, 0.65) calc(var(--fade-start) * 0.6),
        rgba(0, 0, 0, 0.85) calc(var(--fade-start) * 0.8),
        rgba(0, 0, 0, 1) var(--fade-start),
        rgba(0, 0, 0, 1) calc(100% - var(--fade-end)),
        rgba(0, 0, 0, 0.85) calc(100% - var(--fade-end) * 0.8),
        rgba(0, 0, 0, 0.65) calc(100% - var(--fade-end) * 0.6),
        rgba(0, 0, 0, 0.35) calc(100% - var(--fade-end) * 0.4),
        rgba(0, 0, 0, 0.10) calc(100% - var(--fade-end) * 0.2),
        rgba(0, 0, 0, 0) 100%
      );
    }

    .scroll-fade-x.has-fade-start {
      --fade-start: var(--fade-height);
    }

    .scroll-fade-x.has-fade-end {
      --fade-end: var(--fade-height);
    }

    .serp-header {
      display: flex;
      align-items: center;
      padding: 20px 16px 0 28px;
    }

    .serp-logo {
      flex-shrink: 0;
      width: 150px;
      padding-top: 2px;
      font-size: 30px;
    }

    .serp-header .search-box {
      flex: 1;
      max-width: 692px;
      border: 0;
      box-shadow: 0 2px 5px 1px rgba(64, 60, 67, 0.16);
    }

    .serp-header .search-box:hover,
    .serp-header .search-box:focus-within {
      box-shadow: 0 2px 8px 1px rgba(64, 60, 67, 0.24);
    }

    .serp-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-left: 16px;
    }

    .submit-button {
      color: var(--google-blue);
    }

    .clear-button {
      color: var(--color-text-muted);
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 12px;
      padding-left: calc(var(--content-indent) - 2px);
      border-bottom: 1px solid #ebebeb;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 12px;
      border-bottom: 3px solid transparent;
      color: var(--color-icon);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab:hover {
      color: var(--color-text);
    }

    .tab.is-active {
      border-bottom-color: #1f1f1f;
      color: #1f1f1f;
      font-weight: 500;
    }

    .tab-tools {
      margin-left: auto;
      margin-right: 16px;
    }

    .serp-content {
      flex: 1;
      padding: 0 16px 0 var(--content-indent);
    }

    .results {
      max-width: 652px;
    }

    .result-stats {
      height: 43px;
      color: var(--color-text-muted);
      font-size: 14px;
      line-height: 43px;
    }

    .result {
      margin-bottom: 30px;
      line-height: 1.58;
    }

    .result-source {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .favicon {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid #d2d2d2;
      border-radius: 50%;
      background: var(--color-chip);
    }

    .favicon span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    .result-source-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 20px;
    }

    .result-site {
      color: var(--color-text);
      font-size: 14px;
    }

    .result-url {
      overflow: hidden;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .result-more {
      margin-left: 4px;
      color: var(--color-text-secondary);
      font-size: 16px;
      line-height: 1;
    }

    .result-title {
      display: inline-block;
      margin: 0 0 3px;
      padding-top: 5px;
      color: var(--color-link);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      cursor: pointer;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-snippet {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 22px;
    }

    .result-snippet em {
      color: var(--color-icon);
      font-style: normal;
      font-weight: 700;
    }

    .result-date {
      color: var(--color-text-muted);
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
    }

    .questions {
      margin: 4px 0 32px;
    }

    .question {
      border-top: 1px solid var(--color-border);
    }

    .question:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      color: var(--color-text);
      font-size: 16px;
      line-height: 1.4;
      cursor: pointer;
    }

    .question-header .icon {
      color: var(--color-icon);
      transition: transform 0.2s;
    }

    .question.is-open .question-header .icon {
      transform: rotate(180deg);
    }

    .question-answer {
      display: none;
      padding: 4px 0 18px;
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 22px;
    }

    .question.is-open .question-answer {
      display: block;
    }

    .question-answer .result-source {
      margin-top: 14px;
    }

    .question-answer .result-title {
      margin-top: 6px;
      font-size: 18px;
    }

    .related {
      margin: 10px 0 30px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .related-chip {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 48px;
      padding: 0 16px;
      overflow: hidden;
      border-radius: 24px;
      background: var(--color-chip);
      color: var(--color-text);
      font-size: 14px;
      cursor: pointer;
    }

    .related-chip:hover {
      background: var(--color-chip-hover);
    }

    .related-chip .icon {
      color: var(--color-text-muted);
    }

    .related-chip span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .pager {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 20px 0 40px;
      user-select: none;
    }

    .pager-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 20px;
      cursor: pointer;
    }

    .pager-item.is-static,
    .pager-item.is-current {
      cursor: default;
    }

    .pager-letter {
      font-size: 42px;
      line-height: 44px;
      letter-spacing: -2px;
    }

    .pager-number {
      height: 20px;
      margin-top: 6px;
      color: var(--color-link);
      font-size: 14px;
    }

    .pager-item:not(.is-current):hover .pager-number {
      text-decoration: underline;
    }

    .pager-item.is-current .pager-number {
      color: var(--color-text);
    }

    .pager-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
      color: var(--color-link);
      font-size: 14px;
      cursor: pointer;
    }

    .pager-arrow {
      height: 44px;
      font-size: 28px;
      line-height: 44px;
    }

    .pager-nav:hover span:last-child {
      text-decoration: underline;
    }

    .serp-footer {
      border-top: 1px solid var(--color-border);
      background: var(--color-footer);
      color: var(--color-text-muted);
      font-size: 14px;
    }

    .serp-footer-location,
    .serp-footer-links {
      display: flex;
      flex-wrap: wrap;
      padding: 14px 0 14px var(--content-indent);
    }

    .serp-footer-location {
      gap: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    .serp-footer-location b {
      color: var(--color-text);
      font-weight: 400;
    }

    .serp-footer-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--color-text-muted);
    }

    .serp-footer-links {
      gap: 28px;
    }

    .serp-footer a:hover {
      text-decoration: underline;
    }

    .skeleton {
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-line {
      height: 14px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: var(--color-chip);
    }

    .skeleton-line.is-title {
      width: 70%;
      height: 20px;
    }

    .skeleton-line.is-site    { width: 40%; }
    .skeleton-line.is-full    { width: 100%; }
    .skeleton-line.is-partial { width: 85%; margin-bottom: 30px; }

    @keyframes pulse {
      50% {
        opacity: 0.5;
      }
    }

    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      width: 0;
      height: 3px;
      background: var(--google-blue);
    }

    .loading-bar.is-loading {
      width: 85%;
      transition: width 8s cubic-bezier(0.1, 0.7, 0.2, 1);
    }

    .loading-bar.is-done {
      width: 100%;
      opacity: 0;
      transition: width 0.2s, opacity 0.4s 0.2s;
    }

    .error-message {
      padding: 20px 0;
      color: var(--color-text);
      font-size: 16px;
      line-height: 1.7;
    }

    .error-message small {
      display: block;
      margin-top: 8px;
      color: var(--color-text-muted);
      font-size: 13px;
      word-break: break-all;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(32, 33, 36, 0.6);
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 6px;
      font-family: var(--font-brand);
      font-size: 22px;
      font-weight: 400;
    }

    .modal-description {
      margin: 0 0 18px;
      color: var(--color-icon);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-label {
      display: block;
      margin: 12px 0 6px;
      color: var(--color-icon);
      font-size: 12px;
    }

    .modal-field {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      outline: 0;
      background: #ffffff;
      color: var(--color-text);
      font-family: inherit;
      font-size: 14px;
    }

    .modal-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 1px var(--color-accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px;
    }

    .modal-button {
      height: 40px;
      padding: 0 20px;
      border: 0;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .modal-button.is-secondary {
      background: transparent;
      color: var(--color-accent);
    }

    .modal-button.is-secondary:hover {
      background: #f1f6fe;
    }

    .modal-button.is-primary {
      background: var(--color-accent);
      color: #ffffff;
    }

    .modal-button.is-primary:hover {
      background: #1b66c9;
    }

    @media (max-width: 900px) {
      :root {
        --content-indent: 16px;
      }

      .tabs {
        padding-left: 16px;
      }

      .serp-header {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 12px 0;
      }

      .serp-logo {
        width: auto;
        font-size: 26px;
      }

      .serp-header-actions {
        order: 2;
      }

      .serp-header .search-box {
        flex-basis: 100%;
        order: 3;
      }

  <script>
    const GROQ_API_URL = "https://api.groq.com/openai/v1";

    const STORAGE_KEY_API_KEY = "groq_key";
    const STORAGE_KEY_MODEL = "groq_model";

    const PAGE_COUNT = 10;
    const TEMPERATURE = 0.6;
    const MAX_TOKENS = 4096;

    const FAVICON_COLORS = [
      "#4285f4", "#ea4335", "#34a853", "#f29900", "#a142f4",
      "#12b5cb", "#e8710a", "#1a73e8", "#d93025", "#188038",
    ];

    const PREFERRED_MODELS = [
      "openai/gpt-oss-120b",
      "llama-3.3-70b-versatile",
      "moonshotai/kimi-k2-instruct-0905",
      "moonshotai/kimi-k2-instruct",
      "qwen/qwen3-32b",
      "openai/gpt-oss-20b",
      "meta-llama/llama-4-maverick-17b-128e-instruct",
      "llama-3.1-8b-instant",
    ];

    const NON_CHAT_MODEL_PATTERN = /whisper|tts|guard|playai|orpheus|distil|safeguard|compound|embed|vision-preview/i;
    const CHAT_MODEL_PATTERN = /gpt-oss|llama|qwen|kimi|gemma|mistral|deepseek/i;
    const MODEL_ERROR_PATTERN = /model_not_found|decommissioned/i;

    const SYSTEM_PROMPT = `You simulate the Google search engine results page. Given a search query, return ONLY a JSON object that looks exactly like what Google would show.
Rules:
- Write everything in the same language as the query (Korean query -> Korean output).
- Results must look like real web pages from plausible, well-known sites relevant to the query (e.g. 나무위키, 위키백과, 네이버 블로그, 티스토리, 브런치, 뉴스사, 공식 사이트, YouTube, Reddit, Stack Overflow, etc. when appropriate).
- "url" is a Google-style breadcrumb like "https://namu.wiki › w › 주제" or "https://www.example.com › path › page".
- "date" is optional, formatted like "2024. 3. 15." or empty string.
- "answer" is ONE continuous, accurate, well-structured answer to the query written as a single block of plain flowing prose: about 1,200-1,500 characters, no headings, no bullet lists, no line breaks, no paragraph breaks. Wrap a few key terms in **double asterisks**. This answer will be cut into equal-length pieces at arbitrary points (even in the middle of a sentence) and shown as the snippets of the results in order, so it must read as one uninterrupted text from start to finish.
- Results do NOT have their own snippet. The answer text does not need to match each result's title; titles are only for appearance.
- Be accurate and helpful; the answer should genuinely answer the query.
JSON schema:
{"total":"약 12,300,000개","answer":"...","results":[{"site":"사이트 이름","url":"https://... › ...","title":"페이지 제목","date":""}],"people_also_ask":[{"q":"질문","a":"2-3문장 답변","site":"사이트 이름","url":"https://... › ...","title":"페이지 제목"}],"related":["관련 검색어"]}
Return 8 results, 4 people_also_ask items, 8 related searches.`;

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    const elements = {
      home: $("#home"),
      homeForm: $("#home-form"),
      homeQuery: $("#home-query"),
      searchButton: $("#search-button"),
      luckyButton: $("#lucky-button"),
      serp: $("#serp"),
      serpForm: $("#serp-form"),
      serpQuery: $("#serp-query"),
      clearButton: $("#clear-button"),
      results: $("#results"),
      loadingBar: $("#loading-bar"),
      pageFadeTop: $("#page-fade-top"),
      pageFadeBottom: $("#page-fade-bottom"),
      settingsModal: $("#settings-modal"),
      settingsForm: $("#settings-form"),
      settingsCancel: $("#settings-cancel"),
      apiKeyInput: $("#api-key-input"),
      modelSelect: $("#model-select"),
    };

    const resultCache = new Map();
    let pendingQuery = null;
    let latestRequestId = 0;

    const storage = {
      get(key, fallback = "") {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch {
          return fallback;
        }
      },

      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {}
      },
    };

    function escapeHtml(value) {
      const replacements = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      };
      return String(value ?? "").replace(/[&<>"']/g, (char) => replacements[char]);
    }

    function formatEmphasis(text, tag) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, `<${tag}>$1</${tag}>`);
    }

    function icon(name, size = 24) {
      return `<svg class="icon" width="${size}" height="${size}"><use href="#icon-${name}"/></svg>`;
    }

    function renderFavicon(site) {
      const name = String(site || "?");

      let hash = 0;
      for (const char of name) {
        hash = (hash * 31 + char.codePointAt(0)) >>> 0;
      }

      const color = FAVICON_COLORS[hash % FAVICON_COLORS.length];
      const letter = name.trim().charAt(0).toUpperCase() || "?";

      return `<div class="favicon"><span style="background: ${color}">${escapeHtml(letter)}</span></div>`;
    }

    function splitAnswer(text, pieceCount) {
      const fullText = String(text || "").replace(/\s+/g, " ").trim();

      if (!fullText || pieceCount < 1) {
        return [];
      }

      const pieces = [];
      let start = 0;

      for (let index = 1; index < pieceCount; index++) {
        const target = Math.round((fullText.length * index) / pieceCount);
        let cut = target;
        const spaceAfter = fullText.indexOf(" ", target);
        const spaceBefore = fullText.lastIndexOf(" ", target);

        if (spaceAfter !== -1 && (spaceBefore === -1 || spaceAfter - target <= target - spaceBefore)) {
          cut = spaceAfter;
        } else if (spaceBefore > start) {
          cut = spaceBefore;
        }

        if (cut <= start) {
          continue;
        }

        pieces.push(fullText.slice(start, cut).trim());
        start = cut;
      }

      pieces.push(fullText.slice(start).trim());

      return carryBoldMarkers(pieces.filter(Boolean));
    }

    function carryBoldMarkers(pieces) {
      let isBoldOpen = false;

      return pieces.map((piece) => {
        let text = isBoldOpen ? `**${piece}` : piece;
        const markerCount = (text.match(/\*\*/g) || []).length;
        isBoldOpen = markerCount % 2 === 1;

        if (isBoldOpen) {
          text += "**";
        }

        return text;
      });
    }

    async function listModels(apiKey) {
      const response = await fetch(`${GROQ_API_URL}/models`, {
        headers: { Authorization: `Bearer ${apiKey}` },
      });

      if (!response.ok) {
        throw new Error(`모델 목록 HTTP ${response.status}`);
      }

      const body = await response.json();

      return (body.data || [])
        .filter((model) => model.active !== false && !NON_CHAT_MODEL_PATTERN.test(model.id))
        .map((model) => model.id)
        .sort();
    }

    function pickModel(modelIds) {
      return PREFERRED_MODELS.find((id) => modelIds.includes(id))
        || modelIds.find((id) => CHAT_MODEL_PATTERN.test(id))
        || modelIds[0];
    }

    async function resolveModel(apiKey, forceRefresh) {
      const savedModel = storage.get(STORAGE_KEY_MODEL);

      if (savedModel && !forceRefresh) {
        return savedModel;
      }

      const modelIds = await listModels(apiKey);

      if (modelIds.length === 0) {
        throw new Error("사용 가능한 Groq 채팅 모델이 없습니다.");
      }

      const model = pickModel(modelIds);
      storage.set(STORAGE_KEY_MODEL, model);
      return model;
    }

    function buildUserPrompt(query, page) {
      if (page === 1) {
        return `검색어: ${query}`;
      }

      return `검색어: ${query}\n`
        + `(${page}페이지 결과입니다. 1페이지와 다른, 덜 유명한 사이트들의 결과를 생성하고, `
        + `answer에는 이 주제에 대한 더 깊이 있는 추가 설명을 쓰세요.)`;
    }

    async function fetchSearchResults(query, page) {
      const apiKey = storage.get(STORAGE_KEY_API_KEY);

      if (!apiKey) {
        throw Object.assign(new Error("NO_KEY"), { code: "NO_KEY" });
      }

      const userPrompt = buildUserPrompt(query, page);

      try {
        const model = await resolveModel(apiKey, false);
        return await requestCompletion(apiKey, model, userPrompt);
      } catch (error) {
        if (!error.isModelError) {
          throw error;
        }

        const fallbackModel = await resolveModel(apiKey, true);
        return await requestCompletion(apiKey, fallbackModel, userPrompt);
      }
    }

    async function requestCompletion(apiKey, model, userPrompt) {
      const response = await fetch(`${GROQ_API_URL}/chat/completions`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${apiKey}`,
        },
        body: JSON.stringify({
          model,
          temperature: TEMPERATURE,
          max_tokens: MAX_TOKENS,
          response_format: { type: "json_object" },
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: userPrompt },
          ],
        }),
      });

      if (!response.ok) {
        throw await createApiError(response);
      }

      const body = await response.json();
      const content = body.choices?.[0]?.message?.content || "{}";
      const jsonMatch = content.match(/\{[\s\S]*\}/);

      return JSON.parse(jsonMatch ? jsonMatch[0] : content);
    }

    async function createApiError(response) {
      let message = `HTTP ${response.status}`;
      let errorCode = "";

      try {
        const body = await response.json();
        message += ` - ${body.error?.message || ""}`;
        errorCode = body.error?.code || "";
      } catch {}

      const isModelError = response.status === 404 || MODEL_ERROR_PATTERN.test(errorCode + message);

      return Object.assign(new Error(message), { code: response.status, isModelError });
    }

    function renderSkeleton() {
      const block = `
        <div class="skeleton-line is-site"></div>
        <div class="skeleton-line is-title"></div>
        <div class="skeleton-line is-full"></div>
        <div class="skeleton-line is-partial"></div>`;

      return `<div class="result-stats">&nbsp;</div><div class="skeleton">${block.repeat(4)}</div>`;
    }

    function renderSource(site, url, query) {
      return `
        <div class="result-source" data-query="${escapeHtml(query)}">
          ${renderFavicon(site)}
          <div class="result-source-text">
            <span class="result-site">${escapeHtml(site)}</span>
            <span class="result-url">${escapeHtml(url)}</span>
          </div>
          <span class="result-more">⋮</span>
        </div>`;
    }

    function renderResult(result) {
      const date = result.date ? `<span class="result-date">${escapeHtml(result.date)} — </span>` : "";

      return `
        <div class="result">
          ${renderSource(result.site, result.url, result.title)}
          <h3 class="result-title" data-query="${escapeHtml(result.title)}">${escapeHtml(result.title)}</h3>
          <div class="result-snippet">${date}${formatEmphasis(result.snippet, "em")}</div>
        </div>`;
    }

    function renderQuestion(item) {
      const source = item.site ? renderSource(item.site, item.url || "", item.title || item.q) : "";
      const title = item.site && item.title
        ? `<h3 class="result-title" data-query="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h3>`
        : "";

      return `
        <div class="question">
          <div class="question-header">
            <span>${escapeHtml(item.q)}</span>
            ${icon("chevron-down")}
          </div>
          <div class="question-answer">
            ${formatEmphasis(item.a, "b")}
            ${source}
            ${title}
          </div>
        </div>`;
    }

    function renderQuestions(items) {
      if (!items?.length) {
        return "";
      }

      return `
        <div class="questions">
          <h2 class="section-title">다른 사람들이 함께 찾은 질문</h2>
          ${items.map(renderQuestion).join("")}
        </div>`;
    }

    function highlightSuggestion(suggestion, query) {
      const matchIndex = suggestion.toLowerCase().indexOf(query.toLowerCase());

      if (matchIndex < 0) {
        return `<b>${escapeHtml(suggestion)}</b>`;
      }

      const matchEnd = matchIndex + query.length;
      const before = escapeHtml(suggestion.slice(0, matchEnd));
      const after = escapeHtml(suggestion.slice(matchEnd));

      return `${before}<b>${after}</b>`;
    }

    function renderRelated(suggestions, query) {
      if (!suggestions?.length) {
        return "";
      }

      const chips = suggestions.map((item) => {
        const suggestion = String(item);
        return `
          <a class="related-chip" data-query="${escapeHtml(suggestion)}">
            ${icon("search", 20)}
            <span>${highlightSuggestion(suggestion, query)}</span>
          </a>`;
      });

      return `
        <div class="related">
          <h2 class="section-title">관련 검색어</h2>
          <div class="related-grid">${chips.join("")}</div>
        </div>`;
    }

    function renderPagerItem(letters, page, currentPage) {
      if (page === null) {
        return `
          <div class="pager-item is-static">
            <span class="logo pager-letter">${letters}</span>
            <span class="pager-number"></span>
          </div>`;
      }

      const stateClass = page === currentPage ? "is-current" : "";

      return `
        <div class="pager-item ${stateClass}" data-page="${page}">
          <span class="logo pager-letter">${letters}</span>
          <span class="pager-number">${page}</span>
        </div>`;
    }

    function renderPagerNav(page, arrow, label) {
      return `
        <div class="pager-nav" data-page="${page}">
          <span class="pager-arrow">${arrow}</span>
          <span>${label}</span>
        </div>`;
    }

    function renderPager(currentPage) {
      let html = "";

      if (currentPage > 1) {
        html += renderPagerNav(currentPage - 1, "‹", "이전");
      }

      html += renderPagerItem(`<span class="blue">G</span>`, null, currentPage);

      for (let page = 1; page <= PAGE_COUNT; page++) {
        const colorClass = page === currentPage ? "red" : "yellow";
        html += renderPagerItem(`<span class="${colorClass}">o</span>`, page, currentPage);
      }

      html += renderPagerItem(`<span class="blue">g</span><span class="green">l</span><span class="red">e</span>`, null, currentPage);

      if (currentPage < PAGE_COUNT) {
        html += renderPagerNav(currentPage + 1, "›", "다음");
      }

      return `<div class="pager">${html}</div>`;
    }

    function attachSnippets(data) {
      const results = Array.isArray(data.results) ? data.results : [];

      if (!data.answer) {
        return results;
      }

      const snippets = splitAnswer(data.answer, results.length);

      return results
        .slice(0, snippets.length)
        .map((result, index) => ({ ...result, snippet: snippets[index] }));
    }

    function renderResults(data, query, page, elapsedMs) {
      const seconds = (elapsedMs / 1000).toFixed(2);
      const total = data.total || "약 1,000,000개";
      const pageLabel = page > 1 ? `${page}페이지 / ` : "";
      const results = attachSnippets(data);
      const showQuestions = page === 1;

      let html = `<div class="result-stats">${pageLabel}검색결과 ${escapeHtml(total)} (${seconds}초)</div>`;

      results.forEach((result, index) => {
        html += renderResult(result);

        if (showQuestions && index === 1) {
          html += renderQuestions(data.people_also_ask);
        }
      });

      if (showQuestions && results.length < 2) {
        html += renderQuestions(data.people_also_ask);
      }

      html += renderRelated(data.related, query);
      html += renderPager(page);

      elements.results.innerHTML = html;
    }

    function renderError(error, query) {
      if (error.code === "NO_KEY") {
        pendingQuery = query;
        elements.results.innerHTML = `
          <div class="error-message">
            검색하려면 Groq API 키가 필요합니다.
            <small>오른쪽 위의 프로필 아이콘을 눌러 키를 입력하세요.</small>
          </div>`;
        return;
      }

      elements.results.innerHTML = `
        <div class="error-message">
          <b>${escapeHtml(query)}</b>에 대한 결과를 불러오지 못했습니다.<br>
          잠시 후 다시 시도해 주세요.
          <small>${escapeHtml(error.message)}</small>
        </div>`;
    }

    function startLoadingBar() {
      const bar = elements.loadingBar;
      bar.className = "loading-bar";
      void bar.offsetWidth;
      bar.className = "loading-bar is-loading";
    }

    function finishLoadingBar() {
      elements.loadingBar.className = "loading-bar is-done";
    }

    async function search(rawQuery, page = 1) {
      const query = rawQuery.trim();

      if (!query) {
        return;
      }

      showSerp(query);
      window.scrollTo(0, 0);

      const requestId = ++latestRequestId;
      const cacheKey = `${page}|${query}`;
      const startedAt = performance.now();

      if (resultCache.has(cacheKey)) {
        const cached = resultCache.get(cacheKey);
        renderResults(cached.data, query, page, cached.elapsedMs);
        return;
      }

      elements.results.innerHTML = renderSkeleton();
      startLoadingBar();

      try {
        const data = await fetchSearchResults(query, page);
        const elapsedMs = Math.min(performance.now() - startedAt, 900) * 0.6 + 120;
        resultCache.set(cacheKey, { data, elapsedMs });

        if (requestId === latestRequestId) {
          renderResults(data, query, page, elapsedMs);
        }
      } catch (error) {
        if (requestId === latestRequestId) {
          renderError(error, query);
        }
      } finally {
        if (requestId === latestRequestId) {
          finishLoadingBar();
        }
      }
    }

    function showSerp(query) {
      elements.home.hidden = true;
      elements.serp.hidden = false;
      elements.serpQuery.value = query;
      document.title = `${query} - Google 검색`;
    }

    function showHome() {
      elements.serp.hidden = true;
      elements.home.hidden = false;
      elements.homeQuery.value = "";
      document.title = "Google";
      elements.homeQuery.focus();
    }

    function navigate(rawQuery, page = 1) {
      const query = rawQuery.trim();

      if (!query) {
        return;
      }

      const pageParam = page > 1 ? `&p=${page}` : "";
      const hash = `#q=${encodeURIComponent(query)}${pageParam}`;

      if (location.hash === hash) {
        search(query, page);
      } else {
        location.hash = hash;
      }
    }

    function handleRoute() {
      const params = new URLSearchParams(location.hash.slice(1));
      const query = params.get("q");

      if (!query) {
        showHome();
        return;
      }

      const page = Math.max(1, parseInt(params.get("p") || "1", 10) || 1);
      search(query, page);
    }

    async function populateModelSelect() {
      const select = elements.modelSelect;
      const apiKey = elements.apiKeyInput.value.trim();
      const savedModel = storage.get(STORAGE_KEY_MODEL);
      const savedOnly = savedModel ? [savedModel] : [];

      const setOptions = (modelIds, autoLabel) => {
        const options = modelIds
          .map((id) => `<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`)
          .join("");

        select.innerHTML = `<option value="">${autoLabel}</option>${options}`;
        select.value = modelIds.includes(savedModel) ? savedModel : "";
      };

      if (!apiKey) {
        setOptions([], "자동 선택");
        return;
      }

      setOptions(savedOnly, "모델 목록 불러오는 중…");

      try {
        const modelIds = await listModels(apiKey);
        setOptions(modelIds, `자동 선택 (${pickModel(modelIds) || "없음"})`);
      } catch {
        setOptions(savedOnly, "자동 선택 (목록을 불러오지 못함)");
      }
    }

    function openSettings() {
      elements.apiKeyInput.value = storage.get(STORAGE_KEY_API_KEY);
      elements.settingsModal.hidden = false;
      populateModelSelect();
      setTimeout(() => elements.apiKeyInput.focus(), 0);
    }

    function closeSettings() {
      pendingQuery = null;
      elements.settingsModal.hidden = true;
    }

    function saveSettings(event) {
      event.preventDefault();

      storage.set(STORAGE_KEY_API_KEY, elements.apiKeyInput.value.trim());
      storage.set(STORAGE_KEY_MODEL, elements.modelSelect.value);
      resultCache.clear();

      const queryToRetry = pendingQuery;
      closeSettings();

      if (queryToRetry) {
        search(queryToRetry);
      }
    }

    function handleResultsClick(event) {
      const questionHeader = event.target.closest(".question-header");
      if (questionHeader) {
        questionHeader.parentElement.classList.toggle("is-open");
        return;
      }

      const pageLink = event.target.closest("[data-page]");
      if (pageLink) {
        if (!pageLink.classList.contains("is-current")) {
          navigate(elements.serpQuery.value, parseInt(pageLink.dataset.page, 10));
        }
        return;
      }

      const queryLink = event.target.closest("[data-query]");
      if (queryLink) {
        navigate(queryLink.dataset.query);
      }
    }

    function handleKeydown(event) {
      if (event.key === "Escape" && !elements.settingsModal.hidden) {
        closeSettings();
        return;
      }

      if (event.key === "/" && document.activeElement.tagName !== "INPUT") {
        event.preventDefault();
        const input = elements.serp.hidden ? elements.homeQuery : elements.serpQuery;
        input.focus();
      }
    }

    elements.homeForm.addEventListener("submit", (event) => {
      event.preventDefault();
      navigate(elements.homeQuery.value);
    });

    elements.searchButton.addEventListener("click", () => {
      navigate(elements.homeQuery.value);
    });

    elements.luckyButton.addEventListener("click", () => {
      navigate(elements.homeQuery.value || "오늘의 운세");
    });

    elements.serpForm.addEventListener("submit", (event) => {
      event.preventDefault();
      elements.serpQuery.blur();
      navigate(elements.serpQuery.value);
    });

    elements.clearButton.addEventListener("click", () => {
      elements.serpQuery.value = "";
      elements.serpQuery.focus();
    });

    $$("[data-go-home]").forEach((logo) => {
      logo.addEventListener("click", () => {
        location.hash = "";
        showHome();
      });
    });

    $$("[data-open-settings]").forEach((button) => {
      button.addEventListener("click", openSettings);
    });

    elements.apiKeyInput.addEventListener("change", populateModelSelect);
    elements.settingsCancel.addEventListener("click", closeSettings);
    elements.settingsForm.addEventListener("submit", saveSettings);

    elements.settingsModal.addEventListener("click", (event) => {
      if (event.target === elements.settingsModal) {
        closeSettings();
      }
    });

    function updatePageFades() {
      const page = document.documentElement;
      const viewportHeight = Math.max(window.innerHeight, window.visualViewport?.height || 0);
      const scrollTop = window.scrollY;
      const scrollBottom = page.scrollHeight - viewportHeight - scrollTop;
      const isScrollable = page.scrollHeight - viewportHeight > 1;

      elements.pageFadeTop.classList.toggle("is-visible", isScrollable && scrollTop > 1);
      elements.pageFadeBottom.classList.toggle("is-visible", isScrollable && scrollBottom > 1);
    }

    function updateHorizontalFade(container) {
      const scrollLeft = container.scrollLeft;
      const scrollRight = container.scrollWidth - container.clientWidth - scrollLeft;
      const isScrollable = container.scrollWidth - container.clientWidth > 1;

      container.classList.toggle("has-fade-start", isScrollable && scrollLeft > 1);
      container.classList.toggle("has-fade-end", isScrollable && scrollRight > 1);
    }

    function setUpScrollFades() {
      window.addEventListener("scroll", updatePageFades, { passive: true });
      window.addEventListener("resize", updatePageFades);
      window.visualViewport?.addEventListener("resize", updatePageFades);
      window.visualViewport?.addEventListener("scroll", updatePageFades);
      new ResizeObserver(updatePageFades).observe(document.body);
      updatePageFades();

      $$(".scroll-fade-x").forEach((container) => {
        const update = () => updateHorizontalFade(container);
        container.addEventListener("scroll", update, { passive: true });
        new ResizeObserver(update).observe(container);
        update();
      });
    }

    elements.results.addEventListener("click", handleResultsClick);
    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("hashchange", handleRoute);
    setUpScrollFades();

    handleRoute();
  </script>
</body>
</html>
