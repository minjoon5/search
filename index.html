<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>

<style>
:root{
  --bg:#fff;
  --text:#202124;
  --text2:#4d5156;
  --text3:#70757a;
  --link:#1a0dab;
  --visited:#681da8;
  --border:#dadce0;
  --chip:#f1f3f4;
  --shadow:0 1px 6px rgba(32,33,36,.28);
  --blue:#4285f4;
  --red:#ea4335;
  --yellow:#fbbc05;
  --green:#34a853;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:arial,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
[hidden]{display:none!important}

.logo{font-family:"Google Sans","Product Sans","Segoe UI",Roboto,arial,sans-serif;font-weight:500;letter-spacing:-.04em;user-select:none;cursor:pointer;line-height:1}
.logo .b{color:var(--blue)}.logo .r{color:var(--red)}.logo .y{color:var(--yellow)}.logo .g{color:var(--green)}

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:15px;height:60px;padding:6px 16px 0}
.topbar a.tl{font-size:13px;color:rgba(0,0,0,.87)}
.topbar a.tl:hover{text-decoration:underline}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:transparent;color:#5f6368}
.iconbtn:hover{background:rgba(60,64,67,.08)}
.avatar{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:0;outline:4px solid transparent}
.avatar:hover{outline-color:rgba(60,64,67,.08)}

#home{min-height:100vh;display:flex;flex-direction:column}
.home-main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:calc(16vh - 20px)}
.home-main .logo{font-size:92px;margin-bottom:26px}
.sbox{display:flex;align-items:center;width:100%;max-width:584px;height:46px;border:1px solid #dfe1e5;border-radius:24px;padding:0 6px 0 14px;background:#fff}
.sbox:hover,.sbox:focus-within{box-shadow:var(--shadow);border-color:rgba(223,225,229,0)}
.sbox .sicon{color:#9aa0a6;display:flex;margin-right:12px}
.sbox input{flex:1;border:0;outline:0;font-size:16px;color:var(--text);background:transparent;height:100%;min-width:0;font-family:inherit}
.sbox .tools{display:flex;align-items:center;gap:2px}
.sbox .tools .iconbtn{width:40px;height:40px}
.sbox .clear{color:#70757a}
.sbox .divider{width:1px;height:65%;background:#dadce0;margin:0 4px}
.home-btns{display:flex;gap:11px;margin-top:29px;justify-content:center}
.gbtn{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;height:36px;padding:0 16px;cursor:pointer}
.gbtn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1);color:#202124}
.home-lang{margin-top:28px;font-size:13px;color:#4d5156}
.home-lang a{color:#1a0dab;margin:0 3px}
.home-lang a:hover{text-decoration:underline}
footer.hf{background:#f2f2f2;font-size:15px;color:#70757a}
footer.hf .country{padding:15px 30px;border-bottom:1px solid #dadce0}
footer.hf .links{display:flex;justify-content:space-between;flex-wrap:wrap;padding:0 20px}
footer.hf .links div{display:flex;flex-wrap:wrap}
footer.hf .links a{padding:15px;font-size:14px;color:#70757a}
footer.hf .links a:hover{text-decoration:underline}

#serp{min-height:100vh;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;padding:20px 16px 0 28px;gap:0}
.shead .logo{font-size:30px;width:150px;flex-shrink:0;padding-top:2px}
.shead .sbox{max-width:692px;height:46px;flex:1;box-shadow:0 2px 5px 1px rgba(64,60,67,.16);border:0}
.shead .sbox:hover,.shead .sbox:focus-within{box-shadow:0 2px 8px 1px rgba(64,60,67,.24)}
.shead .sbox .sicon{display:none}
.shead .sbox .search-go{color:#4285f4}
.shead .right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:16px}
.tabs{display:flex;gap:4px;padding-left:178px;margin-top:12px;border-bottom:1px solid #ebebeb;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:0 12px;height:44px;display:flex;align-items:center;font-size:14px;color:#5f6368;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.tabs a:hover{color:#202124}
.tabs a.on{color:#1f1f1f;border-bottom-color:#1f1f1f;font-weight:500}
.tabs .tools-link{margin-left:auto;margin-right:16px}

.content{padding-left:180px;padding-right:16px;flex:1}
.col{max-width:652px}
.stats{color:#70757a;font-size:14px;padding:14px 0 10px;line-height:43px;height:43px;padding:0}


.res{margin-bottom:30px;line-height:1.58}
.res .src{display:flex;align-items:center;gap:12px;margin-bottom:5px;cursor:pointer}
.fav{width:28px;height:28px;border-radius:50%;border:1px solid #d2d2d2;background:#f1f3f4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fav span{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.src .meta{display:flex;flex-direction:column;line-height:20px;min-width:0}
.src .site{font-size:14px;color:#202124}
.src .url{font-size:12px;color:#4d5156;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.src .dots{color:#4d5156;margin-left:4px;font-size:16px;line-height:1}
.res h3{margin:0;font-size:20px;font-weight:400;line-height:1.3;color:var(--link);padding-top:5px;margin-bottom:3px;display:inline-block;cursor:pointer}
.res h3:hover{text-decoration:underline}
.res .snip{color:#4d5156;font-size:14px;line-height:22px}
.res .snip em{font-style:normal;font-weight:700;color:#5f6368}
.res .date{color:#70757a}

.paa{margin:4px 0 32px}
.paa h2,.rel h2{font-size:20px;font-weight:400;color:#202124;margin:0 0 12px;font-family:arial,sans-serif;line-height:1.3}
.paa-item{border-top:1px solid #dadce0}
.paa-item:last-child{border-bottom:1px solid #dadce0}
.paa-q{display:flex;justify-content:space-between;align-items:center;padding:0;min-height:48px;cursor:pointer;font-size:16px;color:#202124;line-height:1.4;gap:12px}
.paa-q svg{flex-shrink:0;transition:transform .2s;color:#5f6368}
.paa-item.open .paa-q svg{transform:rotate(180deg)}
.paa-a{display:none;padding:4px 0 18px;font-size:14px;line-height:22px;color:#4d5156}
.paa-item.open .paa-a{display:block}
.paa-a .src{margin-top:14px}
.paa-a .src .site{font-size:14px}

.rel{margin:10px 0 30px}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.rel-grid a{display:flex;align-items:center;gap:14px;background:#f1f3f4;border-radius:24px;padding:0 16px;height:48px;font-size:14px;color:#202124;cursor:pointer;overflow:hidden}
.rel-grid a:hover{background:#e8eaed}
.rel-grid a svg{flex-shrink:0;color:#70757a}
.rel-grid a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-grid a b{font-weight:700}

.pager{display:flex;justify-content:center;align-items:flex-end;margin:20px 0 40px;user-select:none}
.pager .pl{display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:20px}
.pager .pl .letter{font-family:"Product Sans","Google Sans",arial,sans-serif;font-size:42px;line-height:44px;letter-spacing:-2px;font-weight:500}
.pager .pl .num{font-size:14px;color:#1a0dab;margin-top:6px;height:20px}
.pager .pl:hover .num{text-decoration:underline}
.pager .pl.cur .num{color:#202124;font-weight:400}
.pager .pl.cur{cursor:default}
.pager .nav{font-size:14px;color:#1a0dab;display:flex;flex-direction:column;align-items:center;margin:0 10px;cursor:pointer}
.pager .nav .arrow{font-size:28px;line-height:44px;height:44px}
.pager .nav:hover span:last-child{text-decoration:underline}

footer.sf{background:#f2f2f2;border-top:1px solid #dadce0;color:#70757a;font-size:14px}
footer.sf .loc{padding:14px 0 14px 180px;border-bottom:1px solid #dadce0;display:flex;gap:8px;flex-wrap:wrap}
footer.sf .loc b{color:#202124;font-weight:400}
footer.sf .loc .dot{width:10px;height:10px;border-radius:50%;background:#70757a;display:inline-block;margin-top:4px}
footer.sf .fl{padding:14px 0 14px 180px;display:flex;gap:28px;flex-wrap:wrap}
footer.sf a:hover{text-decoration:underline}

.skel{animation:pulse 1.4s ease-in-out infinite}
.skel div{background:#f1f3f4;border-radius:6px;margin-bottom:10px}
@keyframes pulse{50%{opacity:.5}}
.loadbar{position:fixed;top:0;left:0;height:3px;background:#4285f4;width:0;z-index:10;transition:width 8s cubic-bezier(.1,.7,.2,1)}
.loadbar.go{width:85%}
.loadbar.done{width:100%;transition:width .2s;opacity:0;transition:width .2s,opacity .4s .2s}

.err{padding:20px 0;line-height:1.7;color:#202124;font-size:16px}
.err small{display:block;color:#70757a;font-size:13px;margin-top:8px;word-break:break-all}

#modal{position:fixed;inset:0;background:rgba(32,33,36,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:#fff;border-radius:28px;padding:24px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 6px;font-family:"Google Sans",arial,sans-serif;font-weight:400;font-size:22px}
.mbox p{margin:0 0 18px;color:#5f6368;line-height:1.5;font-size:14px}
.mbox label{display:block;font-size:12px;color:#5f6368;margin:12px 0 6px}
.mbox input,.mbox select{width:100%;height:44px;border:1px solid #dadce0;border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;outline:0;background:#fff;color:#202124}
.mbox input:focus,.mbox select:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.mbtns button{height:40px;padding:0 20px;border-radius:20px;border:0;font-size:14px;cursor:pointer;font-weight:500}
.mbtns .cancel{background:transparent;color:#1a73e8}
.mbtns .cancel:hover{background:#f1f6fe}
.mbtns .save{background:#1a73e8;color:#fff}
.mbtns .save:hover{background:#1b66c9}

@media (max-width:900px){
  .content,footer.sf .loc,footer.sf .fl{padding-left:16px}
  .tabs{padding-left:16px}
  .shead{padding:12px 12px 0;flex-wrap:wrap;gap:10px}
  .shead .logo{width:auto;font-size:26px}
  .shead .right{order:2}
  .shead .sbox{order:3;flex-basis:100%}
  .rel-grid{grid-template-columns:1fr}
  .pager .pl:nth-child(n+8){display:none}
}
@media (max-width:600px){
  .home-main .logo{font-size:64px}
  .home-main{padding-left:16px;padding-right:16px}
  .topbar a.tl{display:none}
  .pager .pl .letter{font-size:32px}
}
</style>
</head>

      <button class="iconbtn" aria-label="설정"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13.85 22.25h-3.7c-.74 0-1.36-.54-1.45-1.27l-.27-1.89c-.27-.14-.53-.29-.79-.46l-1.8.72c-.7.26-1.47-.03-1.81-.65L2.2 15.53c-.35-.66-.2-1.44.36-1.88l1.53-1.19c-.01-.15-.02-.3-.02-.46 0-.15.01-.31.02-.46l-1.52-1.19c-.59-.45-.74-1.26-.37-1.88l1.85-3.19c.34-.62 1.11-.9 1.79-.63l1.81.73c.26-.17.52-.32.78-.46l.27-1.91c.09-.7.71-1.25 1.44-1.25h3.7c.74 0 1.36.54 1.45 1.27l.27 1.89c.27.14.53.29.79.46l1.8-.72c.71-.26 1.48.03 1.82.65l1.84 3.18c.36.66.2 1.44-.36 1.88l-1.52 1.19c.01.15.02.3.02.46s-.01.31-.02.46l1.52 1.19c.56.45.72 1.23.37 1.86l-1.86 3.22c-.34.62-1.11.9-1.8.63l-1.8-.72c-.26.17-.52.32-.78.46l-.27 1.91c-.1.68-.72 1.22-1.46 1.22zm-3.23-2h2.76l.37-2.55.53-.22c.44-.18.88-.44 1.34-.78l.45-.34 2.38.96 1.38-2.4-2.03-1.58.07-.56c.03-.26.06-.51.06-.78s-.03-.53-.06-.78l-.07-.56 2.03-1.58-1.39-2.4-2.39.96-.45-.35c-.42-.32-.87-.58-1.33-.77l-.52-.22-.37-2.55h-2.76l-.37 2.55-.53.21c-.44.19-.88.44-1.34.79l-.45.33-2.38-.95-1.39 2.39 2.03 1.58-.07.56a7 7 0 0 0-.06.79c0 .26.02.53.06.78l.07.56-2.03 1.58 1.38 2.4 2.39-.96.45.35c.43.33.86.58 1.33.77l.53.22.38 2.55z"/><circle cx="12" cy="12" r="3.5"/></svg></button>
      <button class="iconbtn" aria-label="Google 앱"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 12c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0-6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm4-8c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2zm-4 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg></button>

<div id="modal" hidden>
  <form class="mbox" id="modalForm">
    <h2>검색 설정</h2>
    <p>Groq API 키를 입력하세요. 키는 이 브라우저에만 저장되고 Groq API로만 전송됩니다.</p>
    <label for="keyInput">Groq API 키</label>
    <input id="keyInput" type="password" placeholder="gsk_..." autocomplete="off" spellcheck="false">
    <label for="modelInput">모델</label>
    <select id="modelInput">
      <option value="">자동 선택</option>
    </select>
    <div class="mbtns">
      <button type="button" class="cancel" id="modalCancel">취소</button>
      <button type="submit" class="save">저장</button>
    </div>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const cache = new Map();
let pendingSearch = null;
let reqId = 0;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<em>$1</em>");
const inlineB = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

const FAV_COLORS = ["#4285f4", "#ea4335", "#34a853", "#f29900", "#a142f4", "#12b5cb", "#e8710a", "#1a73e8", "#d93025", "#188038"];
function favicon(site) {
  const s = String(site || "?");
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const letter = s.trim().charAt(0).toUpperCase() || "?";
  return `<div class="fav"><span style="background:${FAV_COLORS[h % FAV_COLORS.length]}">${esc(letter)}</span></div>`;
}

const SYSTEM_PROMPT = `You simulate the Google search engine results page. Given a search query, return ONLY a JSON object that looks exactly like what Google would show.
Rules:
- Write everything in the same language as the query (Korean query -> Korean output).
- Results must look like real web pages from plausible, well-known sites relevant to the query (e.g. 나무위키, 위키백과, 네이버 블로그, 티스토리, 브런치, 뉴스사, 공식 사이트, YouTube, Reddit, Stack Overflow, etc. when appropriate).
- "url" is a Google-style breadcrumb like "https://namu.wiki › w › 주제" or "https://www.example.com › path › page".
- "date" is optional, formatted like "2024. 3. 15." or empty string.
- "answer" is ONE continuous, accurate, well-structured answer to the query written as plain flowing prose: 12-16 sentences, about 1,200-1,500 characters, no headings, no bullet lists, no line breaks. Each sentence must end with sentence punctuation followed by a space. Wrap a few key terms in **double asterisks**. This answer will be cut into pieces and shown as the snippets of the results in order, so it must read naturally from start to finish.
- Results do NOT have their own snippet; titles should still fit the topic of the answer.
- Be accurate and helpful; the answer should genuinely answer the query.
JSON schema:
{"total":"약 12,300,000개","answer":"...","results":[{"site":"사이트 이름","url":"https://... › ...","title":"페이지 제목","date":""}],"people_also_ask":[{"q":"질문","a":"2-3문장 답변","site":"사이트 이름","url":"https://... › ...","title":"페이지 제목"}],"related":["관련 검색어"]}
Return 8 results, 4 people_also_ask items, 8 related searches.`;

function splitAnswer(text, n) {
  const sentences = String(text || "").replace(/\s+/g, " ").trim().split(/(?<=[.!?。])\s+/).filter(Boolean);
  if (!sentences.length || n < 1) return [];
  const total = sentences.reduce((a, s) => a + s.length, 0);
  const chunks = [];
  let cur = [], acc = 0;
  for (const s of sentences) {
    cur.push(s);
    acc += s.length;
    if (acc >= total * (chunks.length + 1) / n && chunks.length < n - 1) { chunks.push(cur.join(" ")); cur = []; }
  }
  if (cur.length) chunks.push(cur.join(" "));
  return chunks.map(c => (c.match(/\*\*/g) || []).length % 2 ? c.replace(/\*\*(?!.*\*\*)/, "") : c);
}

const MODEL_PREFS = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "moonshotai/kimi-k2-instruct-0905", "moonshotai/kimi-k2-instruct", "qwen/qwen3-32b", "openai/gpt-oss-20b", "meta-llama/llama-4-maverick-17b-128e-instruct", "llama-3.1-8b-instant"];
const NON_CHAT = /whisper|tts|guard|playai|orpheus|distil|safeguard|compound|embed|vision-preview/i;

async function listModels(key) {
  const res = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": `Bearer ${key}` } });
  if (!res.ok) throw new Error(`모델 목록 HTTP ${res.status}`);
  const j = await res.json();
  return (j.data || []).filter(m => m.active !== false && !NON_CHAT.test(m.id)).map(m => m.id).sort();
}

function pickModel(ids) {
  return MODEL_PREFS.find(m => ids.includes(m))
    || ids.find(i => /gpt-oss|llama|qwen|kimi|gemma|mistral|deepseek/i.test(i))
    || ids[0];
}

async function resolveModel(key, force) {
  const saved = store.get("groq_model", "");
  if (saved && !force) return saved;
  const ids = await listModels(key);
  if (!ids.length) throw new Error("사용 가능한 Groq 채팅 모델이 없습니다.");
  const m = pickModel(ids);
  store.set("groq_model", m);
  return m;
}

async function fetchSerp(q, page) {
  const key = store.get("groq_key", "");
  if (!key) throw Object.assign(new Error("NO_KEY"), { code: "NO_KEY" });
  const user = page > 1 ? `검색어: ${q}\n(${page}페이지 결과입니다. 1페이지와 다른, 덜 유명한 사이트들의 결과를 생성하고, answer에는 이 주제에 대한 더 깊이 있는 추가 설명을 쓰세요.)` : `검색어: ${q}`;
  try {
    return await callGroq(key, await resolveModel(key, false), user);
  } catch (e) {
    if (e.modelError) return await callGroq(key, await resolveModel(key, true), user);
    throw e;
  }
}

async function callGroq(key, model, user) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
    body: JSON.stringify({
      model,
      temperature: 0.6,
      max_tokens: 4096,
      response_format: { type: "json_object" },
      messages: [{ role: "system", content: SYSTEM_PROMPT }, { role: "user", content: user }]
    })
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`, code = "";
    try { const j = await res.json(); msg += ` - ${j.error?.message || ""}`; code = j.error?.code || ""; } catch {}
    const modelError = res.status === 404 || /model_not_found|decommissioned|model_decommissioned/i.test(code + msg);
    throw Object.assign(new Error(msg), { code: res.status, modelError });
  }
  const j = await res.json();
  const text = j.choices?.[0]?.message?.content || "{}";
  const m = text.match(/\{[\s\S]*\}/);
  return JSON.parse(m ? m[0] : text);
}

function skeleton() {
  let h = `<div class="stats">&nbsp;</div><div class="skel">`;
  for (let i = 0; i < 4; i++) h += `<div style="width:40%;height:14px"></div><div style="width:70%;height:20px"></div><div style="width:100%;height:14px"></div><div style="width:85%;height:14px;margin-bottom:30px"></div>`;
  return h + `</div>`;
}

function renderResult(r) {
  return `<div class="res">
    <div class="src" data-q="${esc(r.title)}">${favicon(r.site)}<div class="meta"><span class="site">${esc(r.site)}</span><span class="url">${esc(r.url)}</span></div><span class="dots">⋮</span></div>
    <h3 data-q="${esc(r.title)}">${esc(r.title)}</h3>
    <div class="snip">${r.date ? `<span class="date">${esc(r.date)} — </span>` : ""}${inline(r.snippet)}</div>
  </div>`;
}

function renderPaa(items) {
  if (!items?.length) return "";
  return `<div class="paa"><h2>다른 사람들이 함께 찾은 질문</h2>${items.map(p => `
    <div class="paa-item">
      <div class="paa-q"><span>${esc(p.q)}</span><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div>
      <div class="paa-a">${inlineB(p.a)}
        ${p.site ? `<div class="src" data-q="${esc(p.title || p.q)}">${favicon(p.site)}<div class="meta"><span class="site">${esc(p.site)}</span><span class="url">${esc(p.url || "")}</span></div></div>
        ${p.title ? `<h3 style="font-size:18px;color:#1a0dab;margin:6px 0 0;font-weight:400;cursor:pointer" data-q="${esc(p.title)}">${esc(p.title)}</h3>` : ""}` : ""}
      </div>
    </div>`).join("")}</div>`;
}

function renderRelated(list, q) {
  if (!list?.length) return "";
  const ql = q.toLowerCase();
  return `<div class="rel"><h2>관련 검색어</h2><div class="rel-grid">${list.map(t => {
    const s = String(t);
    const i = s.toLowerCase().indexOf(ql);
    const label = i >= 0 ? esc(s.slice(0, i)) + esc(s.slice(i, i + q.length)) + `<b>${esc(s.slice(i + q.length))}</b>` : `<b>${esc(s)}</b>`;
    return `<a data-q="${esc(s)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>${label}</span></a>`;
  }).join("")}</div></div>`;
}

function renderPager(page) {
  const colors = ["b", "r", "y", "b", "g", "r"];
  const n = 10;
  let h = `<div class="pager">`;
  if (page > 1) h += `<div class="nav" data-page="${page - 1}"><span class="arrow">‹</span><span>이전</span></div>`;
  h += `<div class="pl cur" style="cursor:default"><span class="letter logo"><span class="b">G</span></span><span class="num"></span></div>`;
  for (let i = 1; i <= n; i++) {
    const c = i === page ? "r" : "y";
    h += `<div class="pl ${i === page ? "cur" : ""}" data-page="${i}"><span class="letter logo"><span class="${c}">o</span></span><span class="num">${i}</span></div>`;
  }
  h += `<div class="pl cur" style="cursor:default"><span class="letter logo"><span class="b">g</span><span class="g">l</span><span class="r">e</span></span><span class="num"></span></div>`;
  if (page < n) h += `<div class="nav" data-page="${page + 1}"><span class="arrow">›</span><span>다음</span></div>`;
  return h + `</div>`;
}

function render(data, q, page, elapsed) {
  const secs = (elapsed / 1000).toFixed(2);
  const total = data.total || "약 1,000,000개";
  let h = `<div class="stats">${page > 1 ? `${page}페이지 / ` : ""}검색결과 ${esc(total)} (${secs}초)</div>`;
  const raw = Array.isArray(data.results) ? data.results : [];
  const chunks = splitAnswer(data.answer, raw.length);
  const results = data.answer ? raw.slice(0, chunks.length).map((r, i) => ({ ...r, snippet: chunks[i] })) : raw;
  results.forEach((r, i) => {
    h += renderResult(r);
    if (i === 1 && page === 1) h += renderPaa(data.people_also_ask);
  });
  if (results.length < 2 && page === 1) h += renderPaa(data.people_also_ask);
  h += renderRelated(data.related, q);
  h += renderPager(page);
  $("#results").innerHTML = h;
}

function renderError(e, q) {
  if (e.code === "NO_KEY") {
    $("#results").innerHTML = `<div class="err">검색하려면 Groq API 키가 필요합니다.<small>오른쪽 위의 프로필 아이콘을 눌러 키를 입력하세요.</small></div>`;
    pendingSearch = q;
    return;
  }
  $("#results").innerHTML = `<div class="err"><b>${esc(q)}</b>에 대한 결과를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.<small>${esc(e.message)}</small></div>`;
}

function loadbar(state) {
  const b = $("#loadbar");
  if (state === "start") { b.className = "loadbar"; void b.offsetWidth; b.className = "loadbar go"; }
  else { b.className = "loadbar go done"; }
}

async function search(q, page = 1) {
  q = q.trim();
  if (!q) return;
  showSerp(q);
  window.scrollTo(0, 0);
  const id = ++reqId;
  const ck = `${page}|${q}`;
  const t0 = performance.now();
  if (cache.has(ck)) { const c = cache.get(ck); render(c.data, q, page, c.elapsed); return; }
  $("#results").innerHTML = skeleton();
  loadbar("start");
  try {
    const data = await fetchSerp(q, page);
    const elapsed = Math.min(performance.now() - t0, 900) * 0.6 + 120;
    cache.set(ck, { data, elapsed });
    if (id === reqId) render(data, q, page, elapsed);
  } catch (e) {
    if (id === reqId) renderError(e, q);
  } finally {
    if (id === reqId) loadbar("done");
  }
}

function showSerp(q) {
  $("#home").hidden = true;
  $("#serp").hidden = false;
  $("#serpQ").value = q;
  document.title = `${q} - Google 검색`;
}

function showHome() {
  $("#serp").hidden = true;
  $("#home").hidden = false;
  $("#homeQ").value = "";
  document.title = "Google";
  $("#homeQ").focus();
}

function go(q, page = 1) {
  q = q.trim();
  if (!q) return;
  const hash = `#q=${encodeURIComponent(q)}${page > 1 ? `&p=${page}` : ""}`;
  if (location.hash === hash) search(q, page);
  else location.hash = hash;
}

function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  const q = p.get("q");
  if (q) search(q, Math.max(1, parseInt(p.get("p") || "1", 10) || 1));
  else showHome();
}

async function fillModels() {
  const sel = $("#modelInput");
  const key = $("#keyInput").value.trim();
  const saved = store.get("groq_model", "");
  const setOptions = (ids, note) => {
    sel.innerHTML = `<option value="">${note}</option>` + ids.map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join("");
    sel.value = ids.includes(saved) ? saved : "";
  };
  if (!key) { setOptions([], "자동 선택"); return; }
  setOptions(saved ? [saved] : [], "모델 목록 불러오는 중…");
  try {
    const ids = await listModels(key);
    setOptions(ids, `자동 선택 (${pickModel(ids) || "없음"})`);
  } catch {
    setOptions(saved ? [saved] : [], "자동 선택 (목록을 불러오지 못함)");
  }
}

function openModal() {
  $("#keyInput").value = store.get("groq_key", "");
  $("#modal").hidden = false;
  fillModels();
  setTimeout(() => $("#keyInput").focus(), 0);
}
function closeModal() { $("#modal").hidden = true; }

$("#homeForm").addEventListener("submit", e => { e.preventDefault(); go($("#homeQ").value); });
$("#btnSearch").addEventListener("click", () => go($("#homeQ").value));
$("#btnLucky").addEventListener("click", () => go($("#homeQ").value || "오늘의 운세"));
$("#serpForm").addEventListener("submit", e => { e.preventDefault(); $("#serpQ").blur(); go($("#serpQ").value); });
$("#clearBtn").addEventListener("click", () => { $("#serpQ").value = ""; $("#serpQ").focus(); });
$$("[data-home]").forEach(el => el.addEventListener("click", () => { location.hash = ""; showHome(); }));
$$("[data-settings]").forEach(el => el.addEventListener("click", e => { e.preventDefault(); openModal(); }));
$("#keyInput").addEventListener("change", fillModels);
$("#modalCancel").addEventListener("click", () => { pendingSearch = null; closeModal(); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") { pendingSearch = null; closeModal(); } });
$("#modalForm").addEventListener("submit", e => {
  e.preventDefault();
  store.set("groq_key", $("#keyInput").value.trim());
  store.set("groq_model", $("#modelInput").value);
  cache.clear();
  closeModal();
  if (pendingSearch) { const q = pendingSearch; pendingSearch = null; search(q); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    ($("#serp").hidden ? $("#homeQ") : $("#serpQ")).focus();
  }
});
$("#results").addEventListener("click", e => {
  const paa = e.target.closest(".paa-q");
  if (paa) { paa.parentElement.classList.toggle("open"); return; }
  const pg = e.target.closest("[data-page]");
  if (pg && !pg.classList.contains("cur")) { go($("#serpQ").value, parseInt(pg.dataset.page, 10)); return; }
  const qe = e.target.closest("[data-q]");
  if (qe) go(qe.dataset.q);
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
